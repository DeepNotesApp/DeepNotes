name = "deepnotes-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "PAGE_COLLAB_ROOM"
class_name = "PageCollabRoom"

[[durable_objects.bindings]]
name = "USER_REALTIME_ROOM"
class_name = "UserRealtimeRoom"

[[migrations]]
tag = "collab-room-v1"
new_classes = ["PageCollabRoom"]

[[migrations]]
tag = "user-realtime-v1"
new_classes = ["UserRealtimeRoom"]

[[services]]
binding = "WORKER_SELF"
service = "deepnotes-api"

# Replace `id` with a real Hyperdrive config in Cloudflare before production deploy.
# Local dev uses `localConnectionString` (see RESTART_PLAN.md §Hosting).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000-0000-0000-0000-000000000000"
localConnectionString = "postgresql://deepnotes:deepnotes@127.0.0.1:5433/deepnotes"

# Daily cleanup of soft-deleted pages and groups past their grace period.
[[triggers.crons]]
cron = "0 3 * * *"
